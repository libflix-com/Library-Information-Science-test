    <style>
        :root {
            --primary: #2563eb;
            --bg: #f8fafc;
            --text: #1e293b;
            --border: #e2e8f0;

            --correct-border: #22c55e;
            --wrong-bg: #fee2e2;
            --wrong-border: #ef4444;
            --exp-bg: #e0f2fe;
            --exp-border: #0ea5e9;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            padding-bottom: 80px; 
            overflow-x: hidden;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: var(--primary);
            border-bottom: 2px solid var(--border);
            padding-bottom: 20px;
            margin-bottom: 10px;
        }
        
        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 40px;
            font-size: 0.95em;
        }

        .question-card {
            margin-bottom: 40px;
            padding: 20px;
            border: 1px solid var(--border);
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .question {
            font-weight: 600;
            font-size: 1.1em;
            margin-bottom: 15px;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-label {
            display: flex;
            align-items: center;
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s, border-color 0.2s, transform 0.1s ease;
            position: relative;
        }

        .option-label:hover:not(.locked) {
            background-color: #f1f5f9;
            border-color: #cbd5e1;
        }

        input[type="radio"] {
            margin-right: 15px;
            transform: scale(1.2);
            cursor: pointer;
        }

        /* Dynamic Classes */
        .correct-answer {
            background-color: var(--correct-bg) !important;
            border-color: var(--correct-border) !important;
            font-weight: bold;
        }
        
        .wrong-answer {
            background-color: var(--wrong-bg) !important;
            border-color: var(--wrong-border) !important;
            opacity: 0.8;
        }

        /* Telegram-style pop */
        @keyframes telegramPop {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }
        
        .correct-pulse {
            animation: telegramPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Instant Explanation Box */
        .explanation {
            display: none;
            margin-top: 20px;
            padding: 15px 20px;
            background-color: var(--exp-bg);
            border-left: 5px solid var(--exp-border);
            border-radius: 0 8px 8px 0;
            font-size: 0.95em;
            animation: slideDown 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .locked { pointer-events: none; }

        .gesture-icon {
            font-size: 1.2em;
            margin-right: 8px;
            display: inline-block;
        }

        /* Sticky Score Banner */
        #score-banner {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: white;
            padding: 15px;
            text-align: center;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.1);
            font-size: 1.2em;
            font-weight: bold;
            color: var(--primary);
            z-index: 1000;
            border-top: 2px solid var(--primary);
        }

        .confetti-particle {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
        }
    </style>
</head>

            exp: "MDPI launched Preprints.org in May 2016 to provide researchers with a free platform to publish early findings."
        },
        {
            q: "Which organization operates the Directory of Open Access Books (DOAB)?",
            opts: ["OCLC", "DOAJ", "OAPEN", "IFLA"],
            ans: 2,
            exp: "The DOAB acts as a discovery service for peer-reviewed academic books and is managed jointly by the OAPEN Foundation and OpenEdition."
        },
        {
            q: "Traditional Knowledge Digital Library (TKDL) is operated under which Ministries of the Government of India?",
            opts: ["Ministry of Culture and Ministry of Education", "Ministry of Education and Ministry of Ayush", "Ministry of Ayush and Ministry of Science and Technology", "None of among these"],
            ans: 2,
            exp: "TKDL is a joint initiative (2001) between CSIR (Sci & Tech) and Ayush to translate ancient medicinal texts to prevent biopiracy."
        },
        {
            q: "Find out the odd one among these:",
            opts: ["OpenAI", "Anthropic", "Google", "Claude"],
            ans: 3,
            exp: "Claude is a specific AI product/model, whereas OpenAI, Anthropic, and Google are the actual tech organizations that develop AI products."
        },
        {
            q: "Which organization is the central agency for the 'National Mission on Libraries (NML)'?",
            opts: ["INFLIBNET", "NISCAIR", "National Library", "RRRLF"],
            ans: 3,
            exp: "The Raja Rammohun Roy Library Foundation in Kolkata is the nodal agency handling logistics and funding for the NML."
        },
        {
            q: "Which of these is the premier database of research profiles of scientists/researchers/faculty members in India?",
            opts: ["ShodhPrabha", "VIDWAN", "ORCID", "INFED"],
            ans: 1,
            exp: "Maintained by INFLIBNET, VIDWAN is India's premier expert database tracking academic affiliations and publications."
        },
        {
            q: "\"LOCKSS Program\" initiative, which provides libraries with open-source technologies and services, was initiated by:",
            opts: ["MIT Libraries", "Harvard Libraries", "Stanford Libraries", "UCL Libraies"],
            ans: 2,
            exp: "Founded in 1999 at Stanford, LOCKSS ('Lots of Copies Keep Stuff Safe') is a peer-to-peer digital preservation system."
        },
        {
            q: "Who is regarded as the \"Father of the ISBN\"?",
            opts: ["Gordon Foster", "Emery Koltay", "David Whitaker", "SR Ranganathan"],
            ans: 2,
            exp: "David Whitaker was a British publisher who successfully pushed to turn the original 9-digit Book Numbering code into a global standard."
        },
        {
            q: "How much amount has been alloted for APC cost in ONOS scheme?",
            opts: ["INR 150", "INR 150 Laks", "INR 1500 Crores", "INR 150 Crores"],
            ans: 3,
            exp: "Under the One Nation One Subscription scheme, the government allocated ₹150 Crore annually to fund Article Processing Charges (APCs)."
        },
        {
            q: "One Nation, One Subscription (ONOS) scheme was launched by the Ministry of Education in which year?",
            opts: ["2024", "2025", "2026", "None of these"],
            ans: 1,
            exp: "The Union Education Minister officially launched Phase I of the ONOS scheme on January 1, 2025."
        },
        {
            q: "Which open-access model allows authors to deposit a version of their work in an institutional repository?",
            opts: ["Gold OA", "Green OA", "Diamond OA", "Bronze OA"],
            ans: 1,
            exp: "Green OA (self-archiving) allows authors to publish behind a paywall but freely deposit a pre-print or post-print version into a repository."
        },
        {
            q: "A library adopts an AI discovery system but users receive irrelevant results because the training data contains inconsistent metadata. What is the primary problem?",
            opts: ["Algorithmic latency", "Data quality", "Hardware failure", "Network topology"],
            ans: 1,
            exp: "AI models suffer from the 'Garbage In, Garbage Out' rule. If metadata is inconsistent, AI algorithms cannot connect relationships accurately."
        },
        {
            q: "What is the primary goal of a transformative agreement?",
            opts: ["To increase journal subscription prices for university libraries", "To shift funds from subscription (read) models to open access (publish) models", "To eliminate peer review from academic publishing", "To give individual authors full ownership of publisher software"],
            ans: 1,
            exp: "Transformative agreements redirect money libraries historically paid to read journals toward covering open-access publication costs for authors."
        }
    ];

    let currentScore = 0;
    const form = document.getElementById('quizForm');
    document.getElementById('total-score').innerText = quizData.length;

    // Dynamically Generate Quiz Elements
    quizData.forEach((item, index) => {
        const qId = `q${index}`;
        
        const card = document.createElement('div');
        card.className = 'question-card';
        card.id = `card-${qId}`;
        
        const qTitle = document.createElement('div');
        qTitle.className = 'question';
        // Auto-number based on index if not already numbered in string
        let printTitle = item.q;
        if (!/^\d+\./.test(printTitle)) printTitle = `${index + 1}. ${printTitle}`;
        qTitle.innerText = printTitle;
        card.appendChild(qTitle);

        const optionsDiv = document.createElement('div');
        optionsDiv.className = 'options';

        item.opts.forEach((optText, optIndex) => {
            const label = document.createElement('label');
            label.className = 'option-label';
            
            const radio = document.createElement('input');
            radio.type = 'radio';
            radio.name = qId;
            radio.value = optIndex;

            label.appendChild(radio);
            label.appendChild(document.createTextNode(optText));
            optionsDiv.appendChild(label);
        });

        card.appendChild(optionsDiv);

        const expDiv = document.createElement('div');
        expDiv.className = 'explanation';
        expDiv.id = `exp-${qId}`;
        expDiv.innerHTML = `<span class="gesture-icon">💡</span><strong>${item.opts[item.ans]}.</strong> ${item.exp}`;
        
        card.appendChild(expDiv);
        form.appendChild(card);
    });

    // Telegram-style Confetti Effect Generator
    function triggerTelegramEffect(element) {
        const rect = element.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;
        const colors = ['#2563eb', '#22c55e', '#eab308', '#ef4444', '#a855f7'];

        for (let i = 0; i < 30; i++) {
            const particle = document.createElement('div');
            particle.classList.add('confetti-particle');
            
            const size = Math.random() * 6 + 4; 
            const color = colors[Math.floor(Math.random() * colors.length)];
            
            particle.style.width = size + 'px';
            particle.style.height = size + 'px';
            particle.style.backgroundColor = color;
            particle.style.left = centerX + 'px';
            particle.style.top = centerY + 'px';
            
            document.body.appendChild(particle);

            const angle = Math.random() * Math.PI * 2;
            const velocity = 40 + Math.random() * 80; 
            const tx = Math.cos(angle) * velocity;
            const ty = Math.sin(angle) * velocity;

            const animation = particle.animate([
                { transform: 'translate(-50%, -50%) scale(1)', opacity: 1 },
                { transform: `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) scale(0)`, opacity: 0 }
            ], {
                duration: 500 + Math.random() * 300,
                easing: 'cubic-bezier(0, .9, .57, 1)'
            });

            animation.onfinish = () => particle.remove();
        }
    }

    // Attach Event Listeners via Event Delegation
    form.addEventListener('change', function(e) {
        if (e.target.type === 'radio') {
            const qId = e.target.name;
            const selectedVal = parseInt(e.target.value);
            const questionIndex = parseInt(qId.replace('q', ''));
            const correctAns = quizData[questionIndex].ans;
            
            const allRadios = document.getElementsByName(qId);
            
            // Iterate & Style
            allRadios.forEach(radio => {
                radio.disabled = true;
                const label = radio.parentElement;
                label.classList.add('locked');
                
                const val = parseInt(radio.value);
                if (val === correctAns) {
                    label.classList.add('correct-answer');
                    if (selectedVal === correctAns) {
                        label.classList.add('correct-pulse');
                        triggerTelegramEffect(label);
                    }
                } else if (val === selectedVal) {
                    label.classList.add('wrong-answer');
                }
            });

            if (selectedVal === correctAns) {
                currentScore++;
                document.getElementById('current-score').innerText = currentScore;
            }

            // Show explanation
            document.getElementById(`exp-${qId}`).style.display = 'block';
        }
    });
</script>
